<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>DailyMood — A Word for How You Feel</title>

  <!-- PWA Meta -->
  <meta name="description" content="Choose your mood and receive a Bible verse with a personal explanation — every day, every feeling." />
  <meta name="theme-color" content="#0D0C0A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DailyMood" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph -->
  <meta property="og:title" content="DailyMood — A Word for How You Feel" />
  <meta property="og:description" content="Choose your mood. Receive a Bible verse. Find peace." />
  <meta property="og:type" content="website" />

  <link rel="manifest" href="#" id="manifest-placeholder" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0D0C0A;
      --surface: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.07);
      --text-primary: #EDE8DF;
      --text-secondary: #9A9080;
      --text-muted: #524E47;
      --accent: #C5A55A;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans: 'Outfit', system-ui, sans-serif;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text-primary);
      font-family: var(--serif);
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    .aura {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      transition: background 1.2s ease;
    }

    /* ─── SPLASH ─── */
    #splash {
      position: fixed; inset: 0; z-index: 100;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px; text-align: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }

    .splash-cross {
      width: 48px; height: 48px; margin-bottom: 32px;
      position: relative; opacity: 0;
      animation: fadeInUp 0.8s 0.2s ease forwards;
    }
    .splash-cross::before, .splash-cross::after {
      content: ''; position: absolute;
      background: var(--accent); border-radius: 2px;
    }
    .splash-cross::before { width: 4px; height: 100%; left: 50%; transform: translateX(-50%); }
    .splash-cross::after { height: 4px; width: 70%; top: 30%; left: 15%; }

    .splash-title {
      font-family: var(--serif); font-size: clamp(44px, 10vw, 72px);
      font-weight: 300; font-style: italic;
      letter-spacing: -1px; line-height: 1; margin-bottom: 8px;
      opacity: 0; animation: fadeInUp 0.8s 0.4s ease forwards;
    }
    .splash-title span { color: var(--accent); }

    .splash-sub {
      font-family: var(--sans); font-size: 14px; font-weight: 300;
      color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 48px;
      opacity: 0; animation: fadeInUp 0.8s 0.6s ease forwards;
    }

    .splash-tagline {
      font-family: var(--serif); font-style: italic;
      font-size: clamp(16px, 3vw, 20px); color: var(--text-secondary);
      max-width: 320px; line-height: 1.6; margin-bottom: 52px;
      opacity: 0; animation: fadeInUp 0.8s 0.8s ease forwards;
    }

    .btn-enter {
      font-family: var(--sans); font-size: 13px; font-weight: 500;
      letter-spacing: 3px; text-transform: uppercase;
      color: var(--bg); background: var(--accent);
      border: none; border-radius: 40px;
      padding: 16px 40px; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      opacity: 0; animation: fadeInUp 0.8s 1s ease forwards;
    }
    .btn-enter:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(197,165,90,0.3); }
    .btn-enter:active { transform: scale(0.97); }

    .splash-verse {
      position: absolute; bottom: calc(32px + var(--safe-bottom));
      font-family: var(--serif); font-style: italic;
      font-size: 12px; color: var(--text-muted);
      opacity: 0; animation: fadeInUp 0.8s 1.2s ease forwards;
    }

    /* ─── MAIN APP ─── */
    #app {
      display: none; position: relative; z-index: 1;
      max-width: 620px; margin: 0 auto;
      padding: 0 20px 100px;
      min-height: 100dvh;
    }
    #app.visible { display: block; }

    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0 32px;
      opacity: 0; animation: fadeInUp 0.6s 0.1s ease forwards;
    }
    .app-logo {
      font-family: var(--serif); font-style: italic; font-size: 22px;
      color: var(--accent); letter-spacing: -0.5px;
    }
    .app-logo span { color: var(--text-primary); }
    .header-tag {
      font-family: var(--sans); font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase; color: var(--text-muted);
    }

    .section-label {
      font-family: var(--sans); font-size: 10px; letter-spacing: 4px;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px;
      opacity: 0; animation: fadeInUp 0.6s 0.2s ease forwards;
    }

    .mood-grid {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 10px; margin-bottom: 40px;
      opacity: 0; animation: fadeInUp 0.6s 0.3s ease forwards;
    }
    @media (max-width: 400px) { .mood-grid { grid-template-columns: repeat(2, 1fr); } }

    .mood-card {
      border-radius: 16px; padding: 16px 8px 14px;
      text-align: center; cursor: pointer;
      background: var(--surface); border: 1px solid var(--border);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      -webkit-tap-highlight-color: transparent; user-select: none;
    }
    .mood-card:hover { transform: translateY(-3px) scale(1.03); }
    .mood-card:active { transform: scale(0.96); }

    .mood-emoji { font-size: 26px; margin-bottom: 8px; display: block; }
    .mood-name {
      font-family: var(--sans); font-size: 11px; font-weight: 500;
      letter-spacing: 0.5px; text-transform: uppercase;
      display: block; margin-bottom: 4px;
    }
    .mood-desc {
      font-family: var(--sans); font-size: 9px; color: var(--text-muted);
      line-height: 1.4; display: block;
    }

    .verse-area { min-height: 200px; }

    .loading-state {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 64px 0; gap: 20px;
      animation: fadeInScale 0.4s ease;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 2px solid rgba(197,165,90,0.15);
      border-top-color: var(--accent);
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    .loading-text {
      font-family: var(--serif); font-style: italic;
      font-size: 15px; color: var(--text-secondary);
    }

    .verse-card {
      border-radius: 20px; overflow: hidden;
      background: var(--surface); border: 1px solid var(--border);
      animation: fadeInUp 0.6s ease;
    }
    .verse-card-accent { height: 2px; }
    .verse-card-body { padding: 32px 28px 24px; }
    @media (max-width: 400px) { .verse-card-body { padding: 24px 20px 18px; } }

    .verse-reference {
      font-family: var(--sans); font-size: 10px; letter-spacing: 4px;
      text-transform: uppercase; margin-bottom: 20px; display: block;
      animation: pulse 3s ease-in-out infinite;
    }
    .verse-text {
      font-family: var(--serif); font-style: italic;
      font-size: clamp(19px, 3.5vw, 25px);
      line-height: 1.65; color: var(--text-primary);
      border-left: 2px solid; padding-left: 20px; margin-bottom: 28px;
    }
    .verse-divider { height: 1px; margin-bottom: 24px; }
    .verse-explanation {
      font-family: var(--sans); font-size: 14px; font-weight: 300;
      line-height: 1.8; color: var(--text-secondary); margin-bottom: 20px;
    }
    .verse-prayer {
      border-radius: 12px; padding: 16px 18px;
      display: flex; align-items: flex-start; gap: 12px;
    }
    .prayer-icon { font-size: 15px; flex-shrink: 0; margin-top: 2px; }
    .prayer-text {
      font-family: var(--serif); font-style: italic;
      font-size: 14px; color: var(--text-secondary); line-height: 1.6;
    }

    .verse-card-footer {
      border-top: 1px solid var(--border);
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .btn-refresh {
      font-family: var(--sans); font-size: 11px; font-weight: 500;
      letter-spacing: 2px; text-transform: uppercase;
      background: none; border: none; cursor: pointer;
      opacity: 0.5; transition: opacity 0.2s;
      display: flex; align-items: center; gap: 8px;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-refresh:hover { opacity: 1; }
    .btn-refresh:active { transform: scale(0.96); }
    .verse-count { font-family: var(--sans); font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }

    /* Install Banner */
    #install-banner {
      position: fixed; bottom: calc(20px + var(--safe-bottom));
      left: 50%; transform: translateX(-50%) translateY(120px);
      z-index: 200; width: calc(100% - 40px); max-width: 420px;
      background: #1A1815; border: 1px solid rgba(197,165,90,0.3);
      border-radius: 16px; padding: 16px 20px;
      display: flex; align-items: center; gap: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #install-banner.show { transform: translateX(-50%) translateY(0); }
    .install-icon {
      width: 40px; height: 40px; flex-shrink: 0;
      background: var(--accent); border-radius: 10px;
      display: flex; align-items: center; justify-content: center; font-size: 20px;
    }
    .install-text { flex: 1; }
    .install-title { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
    .install-sub { font-family: var(--sans); font-size: 11px; color: var(--text-muted); }
    .install-btns { display: flex; gap: 8px; flex-shrink: 0; }
    .btn-install {
      font-family: var(--sans); font-size: 11px; font-weight: 600;
      background: var(--accent); color: var(--bg);
      border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer;
    }
    .btn-dismiss {
      font-family: var(--sans); font-size: 18px; font-weight: 300;
      background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 4px 8px;
    }

    .app-footer {
      text-align: center; padding: 48px 0 20px;
      font-family: var(--serif); font-style: italic;
      font-size: 12px; color: var(--text-muted);
    }

    @keyframes fadeInUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { to { opacity: 0; transform: translateY(-16px); } }
    @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
  </style>
</head>
<body>

<div class="aura" id="aura"></div>

<!-- SPLASH -->
<div id="splash">
  <div class="splash-cross"></div>
  <h1 class="splash-title">Daily<span>Mood</span></h1>
  <p class="splash-sub">A word for how you feel</p>
  <p class="splash-tagline">"Your word is a lamp to my feet and a light to my path."</p>
  <button class="btn-enter" onclick="enterApp()">Begin ✦</button>
  <p class="splash-verse">Psalm 119:105</p>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="app-logo">Daily<span>Mood</span></div>
    <div class="header-tag">✦ Verse of the Moment</div>
  </div>
  <p class="section-label">How are you feeling right now?</p>
  <div class="mood-grid" id="moodGrid"></div>
  <div class="verse-area" id="verseArea"></div>
  <div class="app-footer">✦ &nbsp; He knows every season of your heart &nbsp; ✦</div>
</div>

<!-- INSTALL BANNER -->
<div id="install-banner">
  <div class="install-icon">✦</div>
  <div class="install-text">
    <div class="install-title">Add DailyMood to your home screen</div>
    <div class="install-sub">One tap away, every day</div>
  </div>
  <div class="install-btns">
    <button class="btn-install" id="btnInstall">Add</button>
    <button class="btn-dismiss" onclick="dismissInstall()">✕</button>
  </div>
</div>

<script>
const MOODS = [
  { id: "anxious",  label: "Anxious",   emoji: "😟", color: "#7B9FBF", desc: "Worried or overwhelmed" },
  { id: "grateful", label: "Grateful",  emoji: "🙏", color: "#C5A55A", desc: "Thankful and blessed" },
  { id: "lonely",   label: "Lonely",    emoji: "🕊️", color: "#9B8ABF", desc: "Feeling alone" },
  { id: "joyful",   label: "Joyful",    emoji: "✨", color: "#5BA87A", desc: "Happy and at peace" },
  { id: "doubt",    label: "Doubting",  emoji: "🌑", color: "#7A7A9A", desc: "Questioning or uncertain" },
  { id: "tired",    label: "Weary",     emoji: "🌿", color: "#8B9E6B", desc: "Exhausted or burned out" },
  { id: "hopeful",  label: "Hopeful",   emoji: "🌅", color: "#BF8A5A", desc: "Looking forward in faith" },
  { id: "grieving", label: "Grieving",  emoji: "💧", color: "#6B8A9E", desc: "Mourning or in pain" },
];

let selectedMood = null;
let isLoading = false;
let verseCount = {};
let deferredPrompt = null;

// PWA Install
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => document.getElementById('install-banner').classList.add('show'), 8000);
});
document.getElementById('btnInstall').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  dismissInstall();
});
function dismissInstall() {
  document.getElementById('install-banner').classList.remove('show');
}

function enterApp() {
  document.getElementById('splash').classList.add('hide');
  setTimeout(() => {
    document.getElementById('splash').style.display = 'none';
    document.getElementById('app').classList.add('visible');
  }, 600);
}

function renderMoodGrid() {
  const grid = document.getElementById('moodGrid');
  grid.innerHTML = MOODS.map(mood => `
    <div class="mood-card" id="card-${mood.id}" onclick="selectMood('${mood.id}')">
      <span class="mood-emoji">${mood.emoji}</span>
      <span class="mood-name" style="color: var(--text-secondary)">${mood.label}</span>
      <span class="mood-desc">${mood.desc}</span>
    </div>
  `).join('');
}

function selectMood(moodId) {
  if (isLoading) return;
  const mood = MOODS.find(m => m.id === moodId);
  if (!mood) return;

  MOODS.forEach(m => {
    const card = document.getElementById('card-' + m.id);
    if (m.id === moodId) {
      card.style.background = `linear-gradient(135deg, ${m.color}25, ${m.color}10)`;
      card.style.borderColor = m.color + '80';
      card.style.boxShadow = `0 0 20px ${m.color}20`;
      card.querySelector('.mood-name').style.color = m.color;
    } else {
      card.style.background = 'var(--surface)';
      card.style.borderColor = 'rgba(255,255,255,0.07)';
      card.style.boxShadow = 'none';
      card.querySelector('.mood-name').style.color = 'var(--text-secondary)';
    }
  });

  document.getElementById('aura').style.background = `
    radial-gradient(ellipse at 15% 15%, ${mood.color}15 0%, transparent 55%),
    radial-gradient(ellipse at 85% 85%, ${mood.color}08 0%, transparent 55%)
  `;

  selectedMood = mood;
  fetchVerse(mood);
}

async function fetchVerse(mood) {
  isLoading = true;
  if (!verseCount[mood.id]) verseCount[mood.id] = 0;
  verseCount[mood.id]++;

  const area = document.getElementById('verseArea');

  if (area.querySelector('.verse-card')) {
    area.querySelector('.verse-card').style.animation = 'fadeOut 0.3s ease forwards';
    await sleep(300);
  }

  area.innerHTML = `
    <div class="loading-state">
      <div class="spinner" style="border-top-color: ${mood.color}"></div>
      <p class="loading-text">Finding a word for your heart…</p>
    </div>
  `;

  try {
    // ✅ Calls our secure serverless function — API key stays private on the server
    const response = await fetch('/api/verse', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        moodId: mood.id,
        moodDesc: mood.desc,
        count: verseCount[mood.id]
      })
    });

    if (!response.ok) throw new Error('Server error');
    const parsed = await response.json();
    renderVerse(parsed, mood);
  } catch (err) {
    area.innerHTML = `
      <div class="loading-state">
        <p style="font-family: var(--serif); font-style: italic; color: #BF5A5A; text-align: center; padding: 0 20px;">
          Something went wrong. Please try again.
        </p>
      </div>
    `;
  } finally {
    isLoading = false;
  }
}

function renderVerse(data, mood) {
  const count = verseCount[mood.id] || 1;
  const area = document.getElementById('verseArea');
  area.innerHTML = `
    <div class="verse-card">
      <div class="verse-card-accent" style="background: linear-gradient(90deg, transparent, ${mood.color}, transparent)"></div>
      <div class="verse-card-body">
        <span class="verse-reference" style="color: ${mood.color}">${data.reference}</span>
        <blockquote class="verse-text" style="border-color: ${mood.color}60">"${data.verse}"</blockquote>
        <div class="verse-divider" style="background: linear-gradient(90deg, ${mood.color}40, transparent)"></div>
        <p class="verse-explanation">${data.explanation}</p>
        <div class="verse-prayer" style="background: ${mood.color}10; border: 1px solid ${mood.color}20">
          <span class="prayer-icon">🙏</span>
          <p class="prayer-text">${data.prayer}</p>
        </div>
      </div>
      <div class="verse-card-footer">
        <button class="btn-refresh" style="color: ${mood.color}" onclick="selectMood('${mood.id}')">
          ↻ &nbsp;New verse
        </button>
        <span class="verse-count">${count > 1 ? `Verse ${count} for this mood` : ''}</span>
      </div>
    </div>
  `;
  setTimeout(() => area.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Service Worker
const swCode = `
const CACHE = 'dailymood-v1';
self.addEventListener('install', e => {
  e.waitUntil(caches.open(CACHE).then(c => c.addAll([self.location.pathname])));
});
self.addEventListener('fetch', e => {
  if (e.request.url.includes('/api/')) return;
  e.respondWith(caches.match(e.request).then(r => r || fetch(e.request)));
});
`;
if ('serviceWorker' in navigator) {
  const blob = new Blob([swCode], { type: 'application/javascript' });
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
}

// Inline Manifest
const manifest = {
  name: "DailyMood", short_name: "DailyMood",
  description: "Choose your mood. Receive a Bible verse. Find peace.",
  start_url: "./", display: "standalone",
  background_color: "#0D0C0A", theme_color: "#0D0C0A",
  icons: [
    { src: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' fill='%230D0C0A'/><text x='96' y='130' font-size='100' text-anchor='middle' fill='%23C5A55A'>✦</text></svg>", sizes: "192x192", type: "image/svg+xml" }
  ]
};
const mBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
document.querySelector('link[rel="manifest"]').href = URL.createObjectURL(mBlob);

renderMoodGrid();
</script>
</body>
</html>
